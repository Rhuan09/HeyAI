name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build --configuration Release
      # windows-latest has no audio endpoint and no media session, so interop tests
      # cannot run here. Contributors run Category=RequiresDesktop locally.
      - run: dotnet test --configuration Release --no-build --filter "Category!=RequiresDesktop"
